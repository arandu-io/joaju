name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # One job per module: a single job with two `cd`s hides which one broke, and
    # the root job cannot reach the other module anyway -- `go vet ./...` and
    # `go test ./...` stop at a directory carrying its own go.mod, so redis/ was
    # compiled and run by nothing here until it got an entry of its own. The
    # binary needs no entry: cmd/joaju is a package of the root module and the
    # root `./...` already covers it.
    strategy:
      fail-fast: false
      matrix:
        module: [".", "redis"]

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    # The relay landed, so here is its server. What redis/ claims is a claim
    # about a protocol -- that a PUBLISH on one connection reaches a SUBSCRIBE
    # on another, that publishing works on a connection which is subscribed, and
    # that a subscription is still there after its socket died -- and a fake that
    # implements the happy path answers none of the three.
    #
    # Valkey rather than Redis: same RESP, and it is the fork that stayed open
    # source. Dragonfly is the recommended default in production and answers the
    # same protocol -- doc 11. The variable is REDIS_ADDRESS because that is the
    # name redis/tests/Integration reads, and the default it falls back to is
    # this same address.
    #
    # The container runs for both entries of the matrix rather than only for the
    # one that uses it: a conditional here would be one more thing to get wrong,
    # and an unused container costs seconds.
    services:
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_ADDRESS: 127.0.0.1:6379

    steps:
      - uses: actions/checkout@v7
        with:
          # The api diff step below reads the tags and checks the last release
          # out into a second worktree. The default checkout fetches one commit
          # and no tags at all, which does not fail that step -- it makes it
          # find no release, say so, and pass. A gate that reports nothing and
          # exits 0 is not a gate.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version
          # ("go 1.26"), and setup-go installs exactly that -- 1.26.0, whose
          # standard library carries vulnerabilities fixed in later patches.
          # govulncheck below is right to fail on it.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against. The minimum in go.mod stays where it is.
          go-version: stable

      # A formatting difference is a failure, not a comment on a pull request.
      - name: gofmt
        # Not `gofmt -l .`: gofmt is the only tool in this chain that does not
        # read build tags, so a *.kyse.go the compiler excludes would still be
        # reported here. There is none in this repository and there should not
        # be one -- the filter is the project's (RULE 5), kept identical across
        # repositories so that the command a contributor copies is the command
        # CI runs.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # ADR-0075, checked rather than remembered. The first of its four checks is
      # the one that has to be mechanical: a file named BrokerTest.go or
      # view_Test.go is production code, `go test` runs nothing inside it, and it
      # says so with no error and no warning. Nothing else here would notice.
      #
      # Once, not per module: the guard reads what git tracks and answers for the
      # whole repository, redis/ included.
      - name: test layout
        if: matrix.module == '.'
        run: bash tests/test-layout-guard.sh

      # A replace builds a module against a directory instead of against the
      # version everybody else resolves, so every build it passes is a build
      # nobody outside can reproduce. redis/ carried the only one in the
      # collection -- `replace github.com/arandu-io/joaju => ..` -- and it hid
      # more than itself: the check that compares a go.mod against what is
      # published skips any module carrying a replace, so adding one also
      # silences the alarm that the requires have gone stale.
      #
      # Zero, in both modules. A rule with an allowance in it needs an argument
      # every time; this one needs none, and there is nothing here it costs --
      # the local checkout is what the workspace at the collection root is for.
      - name: no replace directive
        run: |
          found=$(go mod edit -print | grep -n '^replace' || true)
          if [ -n "$found" ]; then
            echo "go.mod carries a replace, so this module is not built against"
            echo "the version anybody else resolves:"
            echo "$found"
            exit 1
          fi

      # The tags are discovered and not listed here, because a list is the same
      # bug one step later: a suite behind a tag nobody wrote down is a suite
      # nobody vets, and a directory whose every .go file sits behind a tag is
      # invisible to the default gate -- `go build ./...` and `go vet ./...` both
      # exit 0 and print nothing about it. That is measured, not assumed; the
      # script says where.
      #
      # It also refuses a tag that reaches no file, which is what a renamed
      # constraint or a deleted directory looks like. Passing such a tag to vet
      # is silently accepted, so this is the only place it can be caught.
      #
      # Per module, because `./...` stops at a nested go.mod and so does the
      # discovery: the root module's tag is e2e, redis/'s is integration, and
      # neither module can compile the other's files.
      - name: build tags
        id: tags
        run: |
          bash "$GITHUB_WORKSPACE/tests/build-tags.sh" check
          echo "list=$(bash "$GITHUB_WORKSPACE/tests/build-tags.sh" list)" >> "$GITHUB_OUTPUT"

      # With the tags, because without them the suites that need something
      # running -- tests/Integration, which needs a RESP server, and tests/E2E,
      # which needs a JavaScript runtime -- are not compiled at all, and a suite
      # nothing built is a suite nothing checked.
      - name: vet
        run: go vet -tags '${{ steps.tags.outputs.list }}' ./...

      # The race detector matters more here than anywhere else in the project: a
      # connection is a goroutine, a channel is shared by every goroutine
      # subscribed to it, and a broadcast walks the subscriber set while sockets
      # are opening and closing underneath it.
      - name: test
        run: go test -race -tags '${{ steps.tags.outputs.list }}' ./...

      # tests/Integration skips when nothing answers, which is what keeps a
      # laptop with no RESP server green. Here the container is up and
      # REDIS_ADDRESS points at it, so a skip means it never came up -- and a
      # skip that looks like a pass is a green CI over a driver nothing ran.
      #
      # The whole suite rather than one named test: everything in tests/
      # Integration needs a server, so any SKIP at all is the server missing,
      # and a test added later is covered without anyone remembering to add it
      # here. The refusals that need no server are tests/Unit and run either way.
      - name: the tests actually ran against a server
        if: matrix.module == 'redis'
        run: |
          go test -tags integration -count=1 -v ./tests/Integration | tee /tmp/redis-tests
          if grep -q -- '--- SKIP:' /tmp/redis-tests; then
            echo
            echo "the tests skipped: no RESP server answered at $REDIS_ADDRESS"
            exit 1
          fi

      # The graph is this project and the standard library's annex, and it stays
      # that way. The ws subpackage exists so that the transport is ours rather
      # than a library's, and a websocket library, a Redis client or a router
      # imported for one convenience would undo that quietly.
      #
      # arandu-io is this project, and golang.org/x is the standard library's
      # own annex. Anything else fails.
      #
      # The root module only. redis/ is a module of its own precisely so that a
      # driver can live under it (ADR 0048), and running this there would fail
      # the repository for doing the thing that module exists to do.
      - name: no third-party module reached the graph
        if: matrix.module == '.'
        run: |
          outside=$(go list -deps -f '{{if .Module}}{{.Module.Path}}{{end}}' ./... \
                      | sort -u \
                      | grep -vE '^github\.com/arandu-io/|^golang\.org/x/' || true)
          if [ -n "$outside" ]; then
            echo "a third-party module reached the graph:"
            echo "$outside"
            exit 1
          fi

      # ws/ is this project's own RFC 6455, not a fork and not borrowed code
      # (ADR 0052). Copied code arrives carrying its license or its attribution
      # file, so the absence of one is the cheap version of that check -- it
      # will not catch a careful paste, but it does catch the honest one, which
      # is the one that actually happens.
      #
      # ws/ is in the root module, which is the only place it can be checked
      # from.
      - name: ws is still ours
        if: matrix.module == '.'
        run: |
          borrowed=$(find ws \( -name 'LICENSE*' -o -name 'THIRD_PARTY*' \
                                -o -name 'NOTICE*' \) || true)
          if [ -n "$borrowed" ]; then
            echo "ws/ carries an attribution file, so the code came from somewhere else:"
            echo "$borrowed"
            exit 1
          fi

      - name: no Node
        run: |
          found=$(find . -name package.json -o -name node_modules -o -name 'vite.config.*' | grep -v '^./.git' || true)
          if [ -n "$found" ]; then
            echo "Node entered the view layer:"
            echo "$found"
            exit 1
          fi

      # The fourth repository in the collection to gate on its public API, and
      # for the same reason as the other three: something outside imports it.
      # github.com/arandu-io/joaju is on the proxy at v0.1.0 through v0.6.0, and
      # examples/go.mod requires it -- not for a constant, but to implement
      # joaju.Observer and to write policies over joaju.Handshake and
      # joaju.Subscription. Satisfying an interface this module declares is the
      # most break-prone way to depend on it: a method added to Observer still
      # compiles here and stops compiling there, and nothing in this repository
      # would say so.
      #
      # It does not forbid an incompatible change. It requires that one be
      # written down. Broken is allowed. Broken and unwritten is not -- while
      # the version starts with v0. the surface is expected to move, and the
      # whole cost of moving it should be the entry in UPGRADE.md.
      #
      # Both modules, through the matrix, because the answer for redis/ is not
      # that it is too small to gate. It is that the module has never been
      # released: there is no redis/v* tag and the proxy serves no version of
      # github.com/arandu-io/joaju/redis, so there is no last release to compare
      # against, and the step below says exactly that and exits 0. The day the
      # first redis/v0.1.0 is cut this starts gating it with nobody having to
      # remember to come back -- writing the step for the root module alone is
      # what would need remembering.
      - name: api diff against the last release
        env:
          # Through the environment rather than interpolated into the script:
          # the value is a list of identifiers this repository invented, and a
          # list that lands inside the shell as text is a list that can carry
          # more than identifiers.
          TAGS: ${{ steps.tags.outputs.list }}
          MODULE: ${{ matrix.module }}
        run: |
          set -euo pipefail

          # apidiff reads the DEFAULT build, so an exported symbol in a file
          # behind a build tag is a symbol it cannot see -- and a gate with a
          # blind spot reports "no incompatible change" about a surface it never
          # read. Today there is no such file, and that was measured rather than
          # assumed: e2e reaches tests/E2E and integration reaches
          # redis/tests/Integration, `go list` gives GoFiles empty for both, so
          # every file behind a tag in this repository is a _test.go and none of
          # them is API.
          #
          # Checked here rather than written down, because the day a tag starts
          # carrying a non-test file is the day nobody would connect it to this
          # step going quiet. The tags come from the discovery step above, so a
          # tag invented tomorrow is covered without being listed anywhere.
          for tag in $TAGS; do
            # Into variables first, and not straight into comm through two
            # process substitutions. A go list that fails inside <(...) takes
            # its exit code with it: comm then compares two empty lists, finds
            # nothing, and the check passes over a module that does not even
            # load. Assigned like this, set -e stops on it.
            plain=$(go list -f '{{.ImportPath}} {{.GoFiles}}' ./... | sort)
            tagged=$(go list -tags "$tag" -f '{{.ImportPath}} {{.GoFiles}}' ./... | sort)
            hidden=$(comm -13 \
                       <(printf '%s\n' "$plain") \
                       <(printf '%s\n' "$tagged") \
                     | grep -v ' \[\]$' || true)
            if [ -n "$hidden" ]; then
              echo "the build tag '$tag' puts a non-test file into the build:"
              echo "$hidden" | sed 's/^/    /'
              echo
              echo "apidiff reads the default build and cannot see it, so the comparison"
              echo "below would pass over whatever that file exports. Move the symbol out"
              echo "from behind the tag, or teach this step to read the tagged build too."
              exit 1
            fi
          done

          # The tag namespace belongs to the module. A Go submodule is versioned
          # by its directory plus the version, so redis/ is released as
          # redis/vX.Y.Z and the root as vX.Y.Z. Matching 'v*' for both would
          # compare redis/ against the root's release -- a real tree, and the
          # wrong answer, because nobody can resolve
          # github.com/arandu-io/joaju/redis at a version that was never tagged
          # for it.
          if [ "$MODULE" = '.' ]; then
            pattern='v*'
          else
            pattern="$MODULE/v*"
          fi

          # Read out of go.mod rather than written here, so this cannot name one
          # module and compare another.
          modpath=$(go list -m)

          latest=$(git tag --list "$pattern" --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "no release of $modpath to compare against yet"
            exit 0
          fi
          echo "comparing $modpath against $latest"

          tmp=$(mktemp -d)
          old="$tmp/last-release"
          git worktree add -q --detach "$old" "$latest"
          # Reading the old surface has to happen in the old tree: apidiff
          # resolves an import path against the go.mod of the directory it runs
          # in, and from anywhere else it would read the module cache -- which
          # holds the published release, not the tag this checkout is at.
          (cd "$old/$MODULE" && go run golang.org/x/exp/cmd/apidiff@latest -m -w "$tmp/api.out" "$modpath")
          broke=$(go run golang.org/x/exp/cmd/apidiff@latest -m -incompatible "$tmp/api.out" "$modpath" | grep '^- ' || true)
          git worktree remove --force "$old"

          if [ -z "$broke" ]; then
            echo "no incompatible change since $latest"
            exit 0
          fi
          echo "$broke" | sed 's/^/    /'

          # Broken is allowed. Broken and unwritten is not.
          #
          # One UPGRADE.md for the repository and not one per module, and the
          # path is anchored at the workspace root because this step runs from
          # inside the module directory: a bare `-- UPGRADE.md` asked from
          # redis/ is a question about redis/UPGRADE.md, which would find
          # nothing and fail every release over a file that was never meant to
          # exist.
          if git -C "$GITHUB_WORKSPACE" diff --quiet "$latest" -- UPGRADE.md; then
            echo
            echo "there are incompatible changes and UPGRADE.md was not touched since $latest."
            echo "Write what broke and what to write instead. That file is the whole mechanism."
            exit 1
          fi
          echo
          echo "incompatible changes, and UPGRADE.md was updated. Read the entry in review."

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
